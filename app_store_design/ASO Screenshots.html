<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>App Store スクリーンショット — ダーク刷新版</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; }
  body { font-family: "Noto Sans JP", "Hiragino Sans", system-ui, sans-serif; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="app-ui.jsx"></script>
<script type="text/babel" src="aso-frames.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>

<script type="text/babel">
function FrameSlot({ realW, realH, displayW, displayH, children }) {
  const scale = Math.min(displayW / realW, displayH / realH);
  return (
    <div style={{
      width: displayW, height: displayH, background: '#000',
      borderRadius: 12, overflow: 'hidden', position: 'relative',
    }}>
      <div style={{
        width: realW, height: realH,
        transform: `scale(${scale})`, transformOrigin: 'top left',
      }}>{children}</div>
    </div>
  );
}

const D_W = 430;
const D_H = 932;

function App() {
  return (
    <DesignCanvas>
      <DCSection
        id="hero"
        title="スロット 1 + 2 · 2枚連結 (ヒーロー)"
        subtitle="App Store先頭の2枚を1枚絵として設計し、中央でスライスして個別アップロード。「書き出す → AIで整理」のコア体験を見せ切る。"
      >
        <DCArtboard id="hero" label="Hero · 2580 × 2796" width={D_W * 2} height={D_H}>
          <FrameSlot realW={FRAME_W * 2} realH={FRAME_H} displayW={D_W * 2} displayH={D_H}>
            <Frame_Hero2Up />
          </FrameSlot>
        </DCArtboard>
      </DCSection>

      <DCSection
        id="singles"
        title="スロット 3 – 6 · 単体スクリーンショット"
        subtitle="機能ごとに背景の色温度を変えて、横スクロール時にリズムが出るように。タイポは120–130px、コピーは2行以内。"
      >
        <DCArtboard id="s3" label="03 · カレンダー" width={D_W} height={D_H}>
          <FrameSlot realW={FRAME_W} realH={FRAME_H} displayW={D_W} displayH={D_H}>
            <Frame_Calendar />
          </FrameSlot>
        </DCArtboard>
        <DCArtboard id="s4" label="04 · 締切リマインド" width={D_W} height={D_H}>
          <FrameSlot realW={FRAME_W} realH={FRAME_H} displayW={D_W} displayH={D_H}>
            <Frame_TaskDetail />
          </FrameSlot>
        </DCArtboard>
        <DCArtboard id="s5" label="05 · かんたん登録" width={D_W} height={D_H}>
          <FrameSlot realW={FRAME_W} realH={FRAME_H} displayW={D_W} displayH={D_H}>
            <Frame_Quick />
          </FrameSlot>
        </DCArtboard>
        <DCArtboard id="s6" label="06 · プレミアム" width={D_W} height={D_H}>
          <FrameSlot realW={FRAME_W} realH={FRAME_H} displayW={D_W} displayH={D_H}>
            <Frame_Premium />
          </FrameSlot>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
